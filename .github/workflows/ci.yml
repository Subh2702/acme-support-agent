name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  EMBEDDING_BACKEND: hash   # no model download in CI

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term --cov-report=xml
      - name: Coverage gate (policy, tools, guardrails, money >= 85%)
        run: >
          coverage report --fail-under=85
          --include="app/policy/*,app/tools/*,app/guardrails/*,app/money.py"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: acme-support-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot and probe
        run: |
          docker run -d --name app -p 8000:8000 -e DATABASE_URL=sqlite:////app/data/ci.db \
            -e LLM_PROVIDER=ollama -e OLLAMA_BASE_URL=http://127.0.0.1:1 acme-support-agent:ci
          for i in $(seq 1 60); do curl -fs localhost:8000/readyz && break; sleep 2; done
          curl -fs localhost:8000/healthz
          curl -fs localhost:8000/readyz
          docker logs app | tail -20

  smoke-eval:
    # Runs the real agent loop end to end against a tiny local model (Ollama on the CI
    # runner). The gate is safety, not quality: no injection attack may succeed.
    runs-on: ubuntu-latest
    needs: lint-test
    env:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:0.5b
      LLM_TIMEOUT_S: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Install Ollama and pull a tiny model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs localhost:11434/api/version && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"
      - name: Smoke eval (10 scenarios)
        run: python -m eval.run_eval --smoke --no-latest --no-judge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-eval-results
          path: eval/results/runs/
