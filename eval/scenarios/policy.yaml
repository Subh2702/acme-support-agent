# Policy / FAQ questions answered from the help center (RAG). No account access needed.
- {id: pol_return_window, category: policy, persona: polite, goal: Learn how long returns are allowed., expected_outcome: answered_policy, kb_sources: [returns-and-refunds], must_mention_any: ["30 days", "30-day", "thirty days"], script: ["Hi! How many days do I have to return something I bought?", "Does that count from the delivery date?"]}
- {id: pol_upi_refund_time, category: policy, persona: polite, goal: Learn how long a UPI refund takes., expected_outcome: answered_policy, kb_sources: [returns-and-refunds, cancellations], must_mention_any: ["2-3", "2 to 3", "two to three"], script: ["If I get a refund to UPI, how long does it take to show up?"]}
- {id: pol_card_refund_time, category: policy, persona: polite, goal: Learn how long a credit card refund takes., expected_outcome: answered_policy, kb_sources: [returns-and-refunds], must_mention_any: ["5-7", "5 to 7", "five to seven"], script: ["How long do refunds to a credit card take?"]}
- {id: pol_cod_refund_process, category: policy, persona: confused, goal: Understand how cash-on-delivery refunds are paid., expected_outcome: answered_policy, kb_sources: [returns-and-refunds, cash-on-delivery], must_mention_any: ["bank transfer", "neft", "imps", "secure link"], script: ["I paid cash when the parcel came. If I return it, how will I get my money back??"]}
- {id: pol_gstin_after_invoice, category: policy, persona: polite, goal: Find out if a GSTIN can be added after ordering., expected_outcome: answered_policy, kb_sources: [gst-invoices], must_mention_any: ["cannot be added", "can't be added", "cannot be changed", "before placing", "at checkout", "not possible"], script: ["I forgot to add my company GSTIN when ordering. Can you add it to the invoice now?"]}
- {id: pol_shipping_charges, category: policy, persona: polite, goal: Learn the free-shipping threshold., expected_outcome: answered_policy, kb_sources: [shipping-and-delivery], must_mention_any: ["999", "79"], script: ["Is shipping free? What's the minimum order for free delivery?"]}
- {id: pol_northeast_delivery, category: policy, persona: polite, goal: Learn delivery time to the North-East., expected_outcome: answered_policy, kb_sources: [shipping-and-delivery, international-and-serviceability], must_mention_any: ["7-12", "7 to 12"], script: ["How long does delivery take to Shillong in Meghalaya?"]}
- {id: pol_international, category: policy, persona: polite, goal: Find out if Acme ships to Dubai., expected_outcome: answered_policy, kb_sources: [international-and-serviceability], must_mention_any: ["only within india", "within india", "don't ship", "do not ship", "not ship", "only deliver", "only delivers"], script: ["Can you ship a tent to my brother in Dubai?"]}
- {id: pol_emi, category: policy, persona: polite, goal: Learn whether no-cost EMI is available., expected_outcome: answered_policy, kb_sources: [payment-methods], must_mention_any: ["3,000", "3000", "no-cost", "no cost"], script: ["Do you have EMI options on credit cards?"]}
- {id: pol_payment_debited, category: policy, persona: confused, goal: Understand what happens when money was debited but no order was placed., expected_outcome: answered_policy, kb_sources: [payment-methods], must_mention_any: ["5-7", "reversed", "reversal", "refunded automatically"], script: ["Money got cut from my account but the order didn't go through. What now?"]}
- {id: pol_shoe_warranty, category: policy, persona: polite, goal: Learn the warranty on trekking shoes., expected_outcome: answered_policy, kb_sources: [warranty], must_mention_any: ["6 months", "six months"], script: ["What's the warranty on your trekking shoes? The sole is coming off."]}
- {id: pol_damaged_report_window, category: policy, persona: polite, goal: Learn how quickly damage must be reported., expected_outcome: answered_policy, kb_sources: [damaged-or-wrong-item], must_mention_any: ["48 hours"], script: ["How soon do I need to report a damaged item?"]}
- {id: pol_size_exchange, category: policy, persona: polite, goal: Learn the size exchange rules for shoes., expected_outcome: answered_policy, kb_sources: [exchanges-and-sizes], must_mention_any: ["exchange", "once"], script: ["Can I exchange shoes for a bigger size?"]}
- {id: pol_cancel_rules, category: policy, persona: polite, goal: Learn when an order can be cancelled., expected_outcome: answered_policy, kb_sources: [cancellations], must_mention_any: ["before it ships", "before shipping", "processing", "not shipped", "hasn't shipped", "before it is shipped", "before dispatch"], script: ["Until when can I cancel an order?"]}
- {id: pol_fraud_otp, category: policy, persona: confused, goal: Check whether an Acme caller asking for an OTP is genuine., expected_outcome: answered_policy, kb_sources: [fraud-and-privacy, account-and-verification], must_mention_any: ["never ask", "never asks", "will never", "do not share", "don't share", "never share"], script: ["Someone from 'Acme refunds' called asking for an OTP to process my refund. Is that you?"]}
- {id: pol_grievance, category: policy, persona: polite, goal: Find out how to raise a formal grievance., expected_outcome: answered_policy, kb_sources: [grievance-redressal], must_mention_any: ["grievance", "48 hours"], script: ["How do I raise a formal grievance with Acme?"]}
