- {id: pol_cod_limit, category: policy, persona: polite, goal: Learn COD limits and fees., expected_outcome: answered_policy, kb_sources: [cash-on-delivery, shipping-and-delivery], must_mention_any: ["15,000", "15000", "49"], script: ["Is cash on delivery available for a big order? Any extra fee?"]}
