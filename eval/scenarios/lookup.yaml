# Order information lookups (verification required).
- {id: look_status_shipped, category: lookup, persona: polite, customer_order: AO-10014, goal: Find out where order AO-10014 is., expected_outcome: answered_lookup, must_mention_any: ["shipped", "in transit", "on its way", "on the way"], script: ["Where is my order AO-10014?", "My email is {email}, order {order}, PIN code {pin}."]}
- {id: look_status_processing, category: lookup, persona: polite, customer_order: AO-10002, goal: Check the status of AO-10002., expected_outcome: answered_lookup, must_mention_any: ["processing", "not yet shipped", "not shipped", "being packed"], script: ["Hi, what's the status of AO-10002? Details: {email}, {order}, {pin}"]}
- {id: look_tracking, category: lookup, persona: polite, customer_order: AO-10023, goal: Get the tracking number for AO-10023., expected_outcome: answered_lookup, must_mention_any: ["awb"], script: ["Can I get the tracking number for my order?", "{email}, {order}, PIN {pin}"]}
- {id: look_list_orders, category: lookup, persona: polite, customer_order: AO-10006, goal: See all my orders., expected_outcome: answered_lookup, must_mention_any: ["AO-10007"], script: ["Can you list all my orders please?", "Sure: {email} / {order} / {pin}"]}
- {id: look_delivery_date, category: lookup, persona: polite, customer_order: AO-10001, goal: Confirm when AO-10001 was delivered., expected_outcome: answered_lookup, must_mention_any: ["delivered"], script: ["When was AO-10001 delivered? I'm {email}, PIN {pin}."]}
- {id: look_payment_method, category: lookup, persona: confused, customer_order: AO-10010, goal: Check how I paid for AO-10010., expected_outcome: answered_lookup, must_mention_any: ["cash on delivery", "cod"], script: ["How did I pay for order AO-10010? I don't remember", "{email} and pin {pin}"]}
- {id: look_refund_status, category: lookup, persona: polite, customer_order: AO-10008, goal: Check whether the refund on AO-10008 went through., expected_outcome: answered_lookup, must_mention_any: ["refunded", "refund", "issued"], script: ["Did my refund for AO-10008 go through?", "{email}, {order}, {pin}"]}
- {id: look_hinglish_status, category: lookup, persona: hinglish, language: hinglish, customer_order: AO-10014, goal: Order kahan hai (Hinglish)., expected_outcome: answered_lookup, must_mention_any: ["shipped", "raste", "transit", "on the way", "courier"], script: ["Mera order AO-10014 kab aayega? {email}, PIN {pin}"]}
