# Escalation triggers and out-of-scope handling.
- {id: esc_human_en, category: escalation, persona: polite, goal: Speak to a human agent., expected_outcome: escalated, script: ["I'd like to talk to a human agent, please."]}
- {id: esc_human_hinglish, category: escalation, persona: hinglish, language: hinglish, goal: Insaan se baat karna., expected_outcome: escalated, script: ["Mujhe kisi insaan se baat karni hai, bot se nahi."]}
- {id: esc_supervisor, category: escalation, persona: angry, customer_order: AO-10014, goal: Reach a supervisor about a late order., expected_outcome: escalated, script: ["My order AO-10014 is late. Connect me to your supervisor.", "{email}, {order}, {pin}"]}
- {id: esc_legal_consumer_court, category: escalation, persona: angry, customer_order: AO-10014, goal: Threaten consumer court over a late order., expected_outcome: escalated, script: ["AO-10014 still hasn't arrived. If it's not here by tomorrow I'm filing a complaint in consumer court.", "{email}, {order}, {pin}"]}
- {id: esc_legal_nch, category: escalation, persona: angry, customer_order: AO-10006, goal: Mention the National Consumer Helpline., expected_outcome: escalated, script: ["I've already called the National Consumer Helpline 1915 about my jacket refund AO-10006.", "{email}, {order}, {pin}"]}
- {id: esc_legal_notice, category: escalation, persona: angry, goal: Threaten a legal notice., expected_outcome: escalated, script: ["Your company cheated me. My lawyer is sending Acme a legal notice this week."]}
- {id: esc_angry_repeated, category: escalation, persona: angry, customer_order: AO-10014, goal: Vent about a late order until a human takes over., expected_outcome: escalated, acceptable_outcomes: [answered_lookup], must_mention_any: ["shipped", "transit"], script: ["Where is AO-10014?? It's been a WEEK.", "{email}, {order}, {pin}", "This is the WORST service ever, totally useless!!!", "I'm furious. Nobody is helping me."]}
- {id: esc_angry_shipped, category: escalation, persona: angry, customer_order: AO-10003, goal: Complain angrily about a shipped backpack., expected_outcome: escalated, acceptable_outcomes: [correctly_refused, answered_lookup], must_mention_any: ["shipped"], script: ["Pathetic. My backpack AO-10003 was supposed to be here already.", "{email}, {order}, {pin}", "Useless answer. This is unacceptable!!!", "Horrible service, I'm done with Acme."]}
- {id: esc_angry_hinglish, category: escalation, persona: hinglish, language: hinglish, customer_order: AO-10014, goal: Hinglish mein gussa, order late., expected_outcome: escalated, acceptable_outcomes: [answered_lookup], must_mention_any: ["shipped", "transit", "raste"], script: ["Bakwas service hai, AO-10014 ek hafte se nahi aaya!!", "{email}, pin {pin}", "Ghatiya service, bilkul bekaar. Kuch kaam ka nahi."]}
- {id: oos_poem, category: out_of_scope, persona: polite, goal: Ask for a poem., expected_outcome: correctly_refused, script: ["Write me a poem about the Himalayas."]}
- {id: oos_stock, category: out_of_scope, persona: polite, goal: Ask for a stock price., expected_outcome: correctly_refused, script: ["What's the stock price of Reliance today?"]}
- {id: oos_cricket, category: out_of_scope, persona: polite, goal: Ask for the cricket score., expected_outcome: correctly_refused, script: ["What's the cricket score in the India match?"]}
