[project]
name = "acme-support-agent"
version = "1.0.0"
description = "Autonomous customer support agent for Acme Outdoors (fictional Indian e-commerce), with code-enforced policy, guardrails and simulation-based evaluation."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "eval/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL"]
ignore = [
  "PLR0911",  # many return statements is natural for policy functions
  "PLR0912",
  "PLR0913",
  "PLR2004",  # magic values are fine in tests and thresholds are named in PolicyConfig
  "RUF001",   # ₹ and other intentional unicode in strings
  "RUF002",
  "RUF003",
  "S311",     # random is used for deterministic seed data, not crypto
  "PLC0415",  # a few deliberate lazy imports (optional heavy deps, import cycles)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]
"eval/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/llm/anthropic_client.py", "app/llm/hf_client.py"]
